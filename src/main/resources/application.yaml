spring:
  application:
    name: core-service

  datasource:
    url: jdbc:postgresql://localhost:5432/quickbite_core
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    baseline-on-migrate: true

api:
  endpoint:
    base-url: /api/v1
security:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    issuer: quickbite
    expiration: 10m
  refresh-token:
    expiration: 7d


